<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redscapes Laboratory — V1.7</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="redscapes-v1-3">
    <div class="game-wrap">
      <div class="game" tabindex="0" aria-label="Top-down Redscapes laboratory exploration game. Click once, then use the arrow keys or on-screen joystick to move.">
        <canvas id="rsCanvas13" width="360" height="640"></canvas>
        <div class="room-name" id="roomName13" aria-hidden="true">Reception</div>

        <div class="asset-layer" id="assetLayer13" role="dialog" aria-modal="true" aria-label="Recovered document image">
          <button class="asset-close" id="assetClose13" type="button" aria-label="Close document">×</button>
          <img class="asset-image" id="assetImage13" alt="Recovered document">
        </div>

        <div class="mobile-controls" aria-label="Movement joystick">
          <div class="joystick" id="joystick13" aria-hidden="true">
            <div class="joystick-base" id="joystickBase13">
              <div class="joystick-knob" id="joystickKnob13"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
